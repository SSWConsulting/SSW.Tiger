name: Portal CI
on:
  pull_request:
    paths: ['portal/**', 'scripts/portal-*.mjs', 'infra/portal*.bicep*', '.github/workflows/*portal*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci --prefix portal
      - run: npm test --prefix portal
      - run: node --test scripts/portal-*.test.mjs
      - name: Validate Portal infrastructure
        run: |
          az bicep build --file infra/portal.bicep --stdout > /dev/null
          az bicep build --file infra/portal-plan.bicep --stdout > /dev/null
